name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js (standalone)
        working-directory: apps/web
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read EC2 host from SSM
        id: ec2
        run: |
          EC2_HOST=$(aws ssm get-parameter \
            --name /our-adventures/ec2/public-ip \
            --query 'Parameter.Value' \
            --output text)

          case "$EC2_HOST" in
            *[!0-9.]*|'')
              echo "Invalid EC2_HOST from SSM: $EC2_HOST" >&2
              exit 1
              ;;
          esac

          echo "host=$EC2_HOST" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.ec2.outputs.host }}" >> ~/.ssh/known_hosts

      - name: Rsync build to EC2
        run: |
          # Standalone server (includes only the node_modules it needs)
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            apps/web/.next/standalone/ \
            deploy@${{ steps.ec2.outputs.host }}:/home/deploy/app/

          # Static assets (.next/standalone does not include these)
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            apps/web/.next/static/ \
            deploy@${{ steps.ec2.outputs.host }}:/home/deploy/app/.next/static/

          # Public directory
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            apps/web/public/ \
            deploy@${{ steps.ec2.outputs.host }}:/home/deploy/app/public/

          # Migration files
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            db/migrations/ \
            deploy@${{ steps.ec2.outputs.host }}:/home/deploy/migrations/

      - name: Write .env, run migrations, restart service
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ steps.ec2.outputs.host }} 'bash -s' << 'ENDSSH'
          set -e

          # Read secrets from SSM using the EC2 instance profile.
          # No AWS credentials are needed in GHA — the instance role has
          # ssm:GetParameter for /our-adventures/* and /shared/db/*.
          DB_PASS=$(aws ssm get-parameter \
            --name /our-adventures/db/password \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          DB_ENDPOINT=$(aws ssm get-parameter \
            --name /shared/db/endpoint \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          GOOGLE_CLIENT_ID=$(aws ssm get-parameter \
            --name /our-adventures/auth/google-client-id \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          GOOGLE_CLIENT_SECRET=$(aws ssm get-parameter \
            --name /our-adventures/auth/google-client-secret \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          NEXTAUTH_SECRET=$(aws ssm get-parameter \
            --name /our-adventures/auth/secret \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          # Write .env — systemd EnvironmentFile reads this on service start.
          # Using printf to avoid nested heredoc indentation issues.
          printf 'DATABASE_URL=postgresql://our_adventures:%s@%s:5432/vietthan\n' \
            "$DB_PASS" "$DB_ENDPOINT" > /home/deploy/app/.env
          printf 'NEXTAUTH_URL=https://adventures.sleepyshortcake.com\n' >> /home/deploy/app/.env
          printf 'NEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET"      >> /home/deploy/app/.env
          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"    >> /home/deploy/app/.env
          printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" >> /home/deploy/app/.env
          chmod 600 /home/deploy/app/.env

          # Run all migrations in filename order (idempotent — safe on every deploy)
          DATABASE_URL="postgresql://our_adventures:${DB_PASS}@${DB_ENDPOINT}:5432/vietthan?sslmode=verify-full&sslrootcert=/etc/ssl/certs/rds-combined-ca-bundle.pem"
          for migration in $(find /home/deploy/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f "$migration"
          done

          # Restart the Next.js service
          sudo systemctl restart web

          # Wait for the app to be ready before cutting DNS over.
          # systemctl restart can return before the process is actually serving.
          echo "Waiting for app readiness..."
          for i in $(seq 1 30); do
            if systemctl is-active --quiet web && curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "App is ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: App did not become ready within 30s" >&2
              exit 1
            fi
            sleep 1
          done

          # Update Cloudflare A record to point to this instance.
          # Runs after readiness check to avoid a 502 window.
          # Disable xtrace — the SSH block uses set -e only, but guard
          # against future changes that might add -x.
          set +x

          CF_TOKEN=$(aws ssm get-parameter \
            --name /our-adventures/cloudflare/dns-api-token \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          CF_ZONE_ID=$(aws ssm get-parameter \
            --name /our-adventures/cloudflare/zone-id \
            --query Parameter.Value \
            --output text \
            --region us-east-1)

          IMDS_TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
          PUBLIC_IP=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/meta-data/public-ipv4)

          # Find the existing A record ID for adventures.sleepyshortcake.com
          CF_RESPONSE=$(curl -fsS -X GET \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?type=A&name=adventures.sleepyshortcake.com" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json")

          CF_SUCCESS=$(echo "$CF_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
          if [ "$CF_SUCCESS" != "True" ]; then
            echo "ERROR: Cloudflare API list request failed" >&2
            echo "$CF_RESPONSE" >&2
            exit 1
          fi

          CF_RECORD_ID=$(echo "$CF_RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")

          if [ -n "$CF_RECORD_ID" ]; then
            # Update existing record
            CF_UPDATE=$(curl -fsS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${CF_RECORD_ID}" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"adventures\",\"content\":\"${PUBLIC_IP}\",\"proxied\":true}")
            CF_OK=$(echo "$CF_UPDATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
            if [ "$CF_OK" != "True" ]; then
              echo "ERROR: Cloudflare API update failed" >&2
              echo "$CF_UPDATE" >&2
              exit 1
            fi
            echo "Cloudflare A record updated to ${PUBLIC_IP}"
          else
            # Create new record
            CF_CREATE=$(curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"adventures\",\"content\":\"${PUBLIC_IP}\",\"proxied\":true}")
            CF_OK=$(echo "$CF_CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
            if [ "$CF_OK" != "True" ]; then
              echo "ERROR: Cloudflare API create failed" >&2
              echo "$CF_CREATE" >&2
              exit 1
            fi
            echo "Cloudflare A record created for ${PUBLIC_IP}"
          fi
          ENDSSH
